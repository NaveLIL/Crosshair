[package]
name = "crosshair-boot"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
build = "build.rs"

[features]
default = ["versatilepb"]
boot-image = []
versatilepb = ["boot-image"]
blueangel = ["boot-image"]
pxa-reference = []
e2a = ["pxa-reference"]
e2a-mmio-test = ["e2a"]
e2b = []
e2b-negative-test = ["e2b"]
display-test = ["dep:crosshair-ui"]
panic-test = []

[dependencies]
crosshair-ui = { path = "ui", optional = true }

[[bin]]
name = "crosshair-boot"
path = "src/main.rs"
test = false
bench = false
required-features = ["boot-image"]

[[bin]]
name = "crosshair-pxa-reference"
path = "src/pxa_reference.rs"
required-features = ["pxa-reference"]
test = false
bench = false

[[bin]]
name = "crosshair-e2b"
path = "src/e2b.rs"
required-features = ["e2b"]
test = false
bench = false

[[bin]]
name = "crosshair-display-test"
path = "src/display_test.rs"
required-features = ["display-test"]
test = false
bench = false

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
debug = 2
lto = true

[profile.dev]
panic = "abort"
